name: Publish backend to Docker Hub

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (use a new value for each release)
        type: string
        required: true
        default: "1.0.1"

permissions:
  contents: read

concurrency:
  group: dockerhub-backend-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      IMAGE_NAME: devcksgur/ai-study-backend
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate release settings
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo 'Invalid release tag'; exit 1; }
          [[ -n "$DOCKERHUB_TOKEN" ]] || { echo 'Add the DOCKERHUB_TOKEN repository secret first'; exit 1; }

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to private Docker Hub repository
        uses: docker/login-action@v4
        with:
          username: devcksgur
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: devcksgur/ai-study-backend:${{ inputs.tag }}
          build-args: |
            VERSION=${{ inputs.tag }}
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=min
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Inspect published image
        shell: bash
        run: docker buildx imagetools inspect "$IMAGE_NAME:$RELEASE_TAG"

      - name: Record release digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          printf '## Backend image\n\n`%s:%s`\n\nCompose image: `%s@%s`\n' \
            "$IMAGE_NAME" "$RELEASE_TAG" "$IMAGE_NAME" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
